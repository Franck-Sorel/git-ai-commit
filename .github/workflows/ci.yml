name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Python unit tests + lint. Fast, no zsh interaction.
  # ---------------------------------------------------------------------
  python:
    name: python (pytest + ruff)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests bin/worker.py
      - name: Unit tests (pytest)
        run: python -m pytest -q

  # ---------------------------------------------------------------------
  # Zsh plugin tests: smoke, interactive (real ZLE), e2e workflow.
  # Ubuntu (system zsh) + macOS (system zsh) cover both zsh implementations.
  # ---------------------------------------------------------------------
  zsh:
    name: zsh plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh --version
      - name: Check zsh (macOS ships it)
        if: runner.os == 'macOS'
        run: zsh --version
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke test (plugin load + context detection)
        run: zsh -f tests/smoke.zsh
      - name: Interactive test (real ZLE)
        run: zsh tests/interactive.zsh
      - name: End-to-end workflow test (cross-env)
        run: bash tests/e2e-workflow.sh

  # ---------------------------------------------------------------------
  # Full integration: real daemon + real worker vs mock LLM.
  # ---------------------------------------------------------------------
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration (real processes vs mock LLM)
        run: bash tests/integration.sh

  # ---------------------------------------------------------------------
  # Doctor self-check: verifies the diagnostic script runs on both OSes.
  # ---------------------------------------------------------------------
  doctor:
    name: doctor script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install zsh (Ubuntu; macOS ships it)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run doctor (expected to exit 0 on clean runner)
        run: bash scripts/doctor.sh
